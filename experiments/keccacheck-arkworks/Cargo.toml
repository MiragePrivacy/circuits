[package]
name = "mirage-keccacheck-arkworks"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
ark-bn254 = { version = "0.6", features = ["std"] }
ark-ff = { version = "0.6", features = ["asm"] }
ark-groth16 = { version = "0.6", features = ["parallel"] }
ark-r1cs-std = { version = "0.6", features = ["std"] }
ark-relations = { version = "0.6", features = ["std"] }
ark-serialize = { version = "0.6", features = ["std"] }
ark-snark = "0.6"
ark-std = { version = "0.6", features = ["std"] }
# The pinned native prover has not migrated to arkworks 0.6 yet. This alias is
# confined to the native witness boundary; all circuit variables use 0.6.
ark-bn254-05 = { package = "ark-bn254", version = "0.5", features = ["std"] }
blake3 = "1.8"
gkr = { git = "https://github.com/reilabs/keccacheck.git", rev = "15f00e3da5622f1c7155b02d1f9c00bd2416c282", default-features = false }
keccak = "0.1.5"
mirage-gadgets = { path = "../../crates/gadgets" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
