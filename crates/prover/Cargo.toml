[package]
name = "mirage-prover"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mirage_prover"
path = "src/lib.rs"

[[bin]]
name = "measure"
required-features = ["export"]
path = "src/bin/measure.rs"

[[bin]]
name = "measure-native"
path = "src/bin/measure_native.rs"
required-features = ["export"]

[[bin]]
name = "export-verifier"
path = "src/bin/export_verifier.rs"
required-features = ["export"]

[[bin]]
name = "export-native-verifier"
path = "src/bin/export_native_verifier.rs"
required-features = ["export"]

[dependencies]
ark-groth16.workspace = true
ark-snark = { version = "0.6", default-features = false }
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-relations.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
ark-poly = { version = "0.6", default-features = false }
rayon = { version = "1", optional = true }
mirage-relation = { path = "../relation" }
mirage-encoding = { path = "../encoding", optional = true }
num-bigint = { version = "0.4", default-features = false }
hex = { workspace = true, optional = true }
# Renders the Solidity verifier from gnark's template. Builds against
# ark-groth16 0.6, the same version this workspace pins, so the verifying key
# passes through without conversion. Optional: it is a host-side reporting
# dependency and has no place in an enclave image.
taceo-groth16-sol = { version = "0.4.2", optional = true }

[features]
default = ["export", "parallel"]
# The binaries: Solidity rendering, trace printing, hex reporting. Off for an
# enclave build, which needs only the proving path.
export = ["dep:mirage-encoding", "dep:taceo-groth16-sol", "dep:hex", "ark-std/print-trace"]
# Rayon-backed multicore proving. Off by default under Fortanix EDP, where
# thread spawning is constrained by the enclave's provisioned TCS count.
parallel = [
    "ark-groth16/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
    "dep:rayon",
]

[dev-dependencies]
ark-r1cs-std.workspace = true
